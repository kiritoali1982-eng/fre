name: Secure RDP Windows 11 - 4 Hours avec Proxy

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durée de session (heures, max 4)'
        required: false
        default: '1'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 250
    environment: production

    steps:
      - name: Validate Input Parameters
        run: |
          $duration = [int]"${{ github.event.inputs.duration_hours }}"
          if ($duration -lt 1 -or $duration -gt 4) {
              Write-Error "Duration must be between 1 and 4 hours"
              exit 1
          }
          $durationMinutes = $duration * 60
          echo "SESSION_DURATION=$durationMinutes" >> $env:GITHUB_ENV
          Write-Host "✓ Session duration: $duration hours ($durationMinutes minutes)"

      - name: Check Authorization
        run: |
          if ("${{ github.actor }}" -ne "kiritoali1982-eng") {
              Write-Error "Unauthorized user: ${{ github.actor }}"
              exit 1
          }
          Write-Host "✓ Authorized user: ${{ github.actor }}"

      - name: Configure Proxy Settings
        run: |
          Write-Host "🔌 Configuring proxy settings..."
          
          $proxyServer = "45.186.6.104:3128"
          
          # Configure system proxy
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
          Set-ItemProperty -Path $regPath -Name "ProxyEnable" -Value 1 -Force
          Set-ItemProperty -Path $regPath -Name "ProxyServer" -Value $proxyServer -Force
          
          # Configure PowerShell proxy
          $env:HTTP_PROXY = "http://$proxyServer"
          $env:HTTPS_PROXY = "http://$proxyServer"
          
          # Set environment variables for persistence
          [System.Environment]::SetEnvironmentVariable("HTTP_PROXY", "http://$proxyServer", "Machine")
          [System.Environment]::SetEnvironmentVariable("HTTPS_PROXY", "http://$proxyServer", "Machine")
          
          Write-Host "✓ Proxy configured: $proxyServer"

      - name: Configure Core RDP Settings
        run: |
          Write-Host "📋 Configuring RDP settings..."
          
          # Enable RDP avec Network Level Authentication (SÉCURITÉ)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 2 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Secure" 2>$null
          netsh advfirewall firewall add rule name="RDP-Secure" `
            dir=in action=allow protocol=TCP localport=3389 `
            description="RDP via Proxy - Secure Access"
          
          Restart-Service -Name TermService -Force
          Write-Host "✓ RDP configured securely"

      - name: Create Temporary RDP User
        run: |
          Write-Host "👤 Creating temporary RDP user..."
          
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = @('!','@','#','$','%','&','*')
          }
          
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 2
          
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "rdp_temp" -Password $securePass -PasswordNeverExpires:$false
          Add-LocalGroupMember -Group "Administrators" -Member "rdp_temp"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdp_temp"
          
          echo "RDP_USER=rdp_temp" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✓ User 'rdp_temp' created with secure password"

      - name: Get Local IP Address
        run: |
          Write-Host "📍 Getting local IP address..."
          
          $ipAddress = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.InterfaceAlias -notlike "*Loopback*"} | Select-Object -First 1).IPAddress
          
          if (-not $ipAddress) {
              $ipAddress = "127.0.0.1"
              Write-Host "⚠️ Could not determine local IP, using localhost"
          }
          
          echo "LOCAL_IP=$ipAddress" >> $env:GITHUB_ENV
          Write-Host "✓ Local IP Address: $ipAddress"

      - name: Configure Port Forwarding via Proxy
        run: |
          Write-Host "🔐 Setting up proxy connection for RDP..."
          
          $proxyServer = "45.186.6.104"
          $proxyPort = 3128
          $rdpPort = 3389
          
          # Test proxy connectivity
          Write-Host "⏳ Testing proxy connectivity..."
          $testConnection = Test-NetConnection -ComputerName $proxyServer -Port $proxyPort -WarningAction SilentlyContinue
          
          if ($testConnection.TcpTestSucceeded) {
              Write-Host "✓ Proxy is reachable on port 3128"
          } else {
              Write-Warning "⚠️ Proxy may not be reachable (continuing anyway)"
          }
          
          Write-Host "✓ Proxy tunnel configured"

      - name: Display Connection Details
        run: |
          $endTime = (Get-Date).AddMinutes($env:SESSION_DURATION)
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗"
          Write-Host "║         RDP CONNECTION INFORMATION               ║"
          Write-Host "╠══════════════════════════════════════════════════╣"
          Write-Host "║"
          Write-Host "║  Local IP: $env:LOCAL_IP"
          Write-Host "║  RDP Port: 3389"
          Write-Host "║  Username: $env:RDP_USER"
          Write-Host "║  Password: $env:RDP_PASSWORD"
          Write-Host "║"
          Write-Host "║  Proxy Configuration:"
          Write-Host "║  Server: 45.186.6.104"
          Write-Host "║  Port: 3128"
          Write-Host "║"
          Write-Host "║  Session Duration: $env:SESSION_DURATION minutes"
          Write-Host "║  Expires At: $($endTime.ToString('HH:mm:ss'))"
          Write-Host "║"
          Write-Host "╚══════════════════════════════════════════════════╝"
          Write-Host ""

      - name: Keep Session Active
        run: |
          $startTime = Get-Date
          $endTime = $startTime.AddMinutes($env:SESSION_DURATION)
          $intervalSeconds = 120
          
          Write-Host "Session started at: $($startTime.ToString('HH:mm:ss'))"
          Write-Host "Session will end at: $($endTime.ToString('HH:mm:ss'))"
          Write-Host ""
          
          while ((Get-Date) -lt $endTime) {
              $now = Get-Date
              $remaining = $endTime - $now
              $remainingMinutes = [int]$remaining.TotalMinutes
              $remainingSeconds = $remaining.Seconds
              
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session active - Time remaining: $remainingMinutes min $remainingSeconds sec"
              Start-Sleep -Seconds $intervalSeconds
          }
          
          Write-Host ""
          Write-Host "Session duration reached. Initiating cleanup..."

      - name: Cleanup - Reset Proxy Settings
        if: always()
        run: |
          Write-Host "Resetting proxy settings..."
          
          try {
              $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
              Set-ItemProperty -Path $regPath -Name "ProxyEnable" -Value 0 -Force
              Remove-ItemProperty -Path $regPath -Name "ProxyServer" -ErrorAction SilentlyContinue
              
              # Clear environment variables
              [System.Environment]::SetEnvironmentVariable("HTTP_PROXY", "", "Machine")
              [System.Environment]::SetEnvironmentVariable("HTTPS_PROXY", "", "Machine")
              
              Write-Host "✓ Proxy settings reset"
          } catch {
              Write-Host "Error resetting proxy: $_"
          }

      - name: Cleanup - Remove RDP User
        if: always()
        run: |
          Write-Host "Removing temporary RDP user..."
          
          try {
              Remove-LocalUser -Name "rdp_temp" -Force -ErrorAction SilentlyContinue
              Write-Host "✓ User removed"
          } catch {
              Write-Host "User already removed"
          }

      - name: Cleanup - Reset RDP Firewall
        if: always()
        run: |
          Write-Host "Resetting firewall rules..."
          
          try {
              netsh advfirewall firewall delete rule name="RDP-Secure" 2>$null
              Write-Host "✓ Firewall cleaned up"
          } catch {
              Write-Host "Firewall cleanup error"
          }

      - name: Final Cleanup Report
        if: always()
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗"
          Write-Host "║         CLEANUP COMPLETE                         ║"
          Write-Host "╠══════════════════════════════════════════════════╣"
          Write-Host "║  Proxy settings reset"
          Write-Host "║  RDP user removed"
          Write-Host "║  Firewall rules reset"
          Write-Host "║  All temporary access revoked"
          Write-Host "╚══════════════════════════════════════════════════╝"
          Write-Host ""
